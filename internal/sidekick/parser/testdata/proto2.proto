syntax = "proto2";
package test;

// A test message.
message Fake {
  // An optional scalar field.
  optional int32 f_int32 = 1;
  // An optional string field.
  optional string f_string = 2;
  // An optional enum field.
  optional Kind f_enum = 3;
  // An optional field with a non-zero default.
  optional bool f_default = 4 [default = true];
  // A required field.
  required string f_required = 5;
  // A repeated field.
  repeated string f_repeated = 6;
  // An optional message field.
  optional Inner f_message = 7;
  // A map field.
  map<string, int32> f_map = 8;
  oneof choice {
    // A oneof field.
    string f_oneof = 9;
  }
  optional group Result = 10 {
    optional string url = 1;
  }

  // A test enum.
  enum Kind {
    KIND_A = 1;
  }

  // A nested message.
  message Inner {
    // An optional field in a nested message.
    optional int32 f_inner = 1;
  }
}
