syntax = "proto2";

package google.cloud.customoption.v1;

import "google/protobuf/descriptor.proto";

option go_package = "cloud.google.com/go/customoption/apiv1/customoptionpb;customoptionpb";

// Note is a message of an API that also declares a custom option.
message Note {
  optional string text = 1;
}

// note extends a message outside this package, so an internal copy of the
// package would register the same extension number a second time.
extend google.protobuf.MessageOptions {
  optional string note = 50001;
}
