name: PHP
on: [push, pull_request, merge_group]
permissions:
  contents: read
jobs:
  unit-test:
    name: Unit test
    runs-on: ubuntu-24.04
    # Presubmit jobs must complete within 5 minutes. Integration might take longer.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-librarian
        with:
          include_pnpm: 'true'
          include_python: 'true'
      - name: Checkout google-cloud-php (Sparse)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: googleapis/google-cloud-php
          path: google-cloud-php
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            composer.json
            dev/
            librarian.yaml
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, bcmath
      - name: Cache Librarian Tools
        id: cache-tools
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cache/librarian
          key: librarian-php-tools-v2-${{ runner.os }}-${{ hashFiles('internal/config/**/*.go') }}-${{ hashFiles('google-cloud-php/librarian.yaml') }}
      - name: Run librarian install
        working-directory: google-cloud-php
        run: |
          librarian install
      - name: Run internal/librarian/php tests and check coverage
        run: go run ./tool/cmd/coverage ./internal/librarian/php
  smoke-test:
    name: Smoke test
    runs-on: ubuntu-24.04
    # Presubmit jobs must complete within 5 minutes. Integration might take longer.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-librarian
        with:
          include_pnpm: 'true'
          include_python: 'true'
      - name: Checkout google-cloud-php (Sparse)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: googleapis/google-cloud-php
          path: google-cloud-php
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            librarian.yaml
            composer.json
            dev/
            # Note: If changing the target of the smoke test below, update this sparse checkout rule.
            SecretManager/
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, bcmath
      - name: Cache Librarian Tools
        id: cache-tools
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cache/librarian
          key: librarian-php-tools-v2-${{ runner.os }}-${{ hashFiles('internal/config/**/*.go') }}-${{ hashFiles('google-cloud-php/librarian.yaml') }}
      - name: Run librarian install
        working-directory: google-cloud-php
        run: |
          librarian install
      - name: Generate a single library (smoke test)
        working-directory: google-cloud-php
        run: librarian generate secretmanager
  integration-test:
    name: Integration test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-librarian
        with:
          include_pnpm: 'true'
          include_python: 'true'
      - name: Checkout google-cloud-php (Full)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: googleapis/google-cloud-php
          path: google-cloud-php
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, bcmath
      - name: Cache Librarian Tools
        id: cache-tools
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cache/librarian
          key: librarian-php-tools-v2-${{ runner.os }}-${{ hashFiles('internal/config/**/*.go') }}-${{ hashFiles('google-cloud-php/librarian.yaml') }}
      - name: Run librarian install
        working-directory: google-cloud-php
        run: |
          librarian install
      - name: Generate all libraries (integration test)
        working-directory: google-cloud-php
        run: librarian generate --all
  create-issue-on-failure:
    needs: [unit-test, smoke-test, integration-test]
    permissions:
      contents: read
      issues: write
    if: ${{ always() && contains(needs.*.result, 'failure') && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/create-issue-on-failure.yaml
    with:
      language: PHP
      repository: google-cloud-php
