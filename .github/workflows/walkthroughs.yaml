# Builds the interactive walkthroughs from doc/walkthroughs and publishes
# them to GitHub Pages. Pull requests only build the site and upload it as
# an artifact for preview; pushes to main also deploy it.
#
# Deploying requires GitHub Pages to be enabled for the repository with
# "GitHub Actions" as the source (Settings > Pages). Until then the deploy
# job fails harmlessly and the build job still verifies the excerpts.
name: Walkthroughs
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - doc/walkthroughs/**
      - tool/cmd/walkthrough/**
      - .github/workflows/walkthroughs.yaml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    # Presubmit jobs must complete within 5 minutes. See CONTRIBUTING.md.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: "go.mod"
      - name: Build site
        run: go run ./tool/cmd/walkthrough -out _site
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
