# Verifies the interactive walkthroughs in doc/walkthroughs: every code
# excerpt, symbol anchor and generated table must still resolve against the
# tree, and the site must build. The site is not published; developers run
# it locally with `go run ./tool/cmd/walkthrough -serve 127.0.0.1:8080`.
name: Walkthroughs
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - doc/walkthroughs/**
      - tool/cmd/walkthrough/**
      - .github/workflows/walkthroughs.yaml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    # Presubmit jobs must complete within 5 minutes. See CONTRIBUTING.md.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: "go.mod"
      - name: Check anchors
        run: go run ./tool/cmd/walkthrough -check
      - name: Build site
        run: go run ./tool/cmd/walkthrough -out _site
